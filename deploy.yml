# ============================================================
# GITHUB ACTIONS — XAU/USD 24/7 Analyzer PRO
# Rebuild auto tous les jours a minuit UTC
# Fetch FRED + Build + Deploy GitHub Pages
# ============================================================

name: Deploy XAU/USD 24/7 Analyzer

on:
  # Rebuild automatique tous les jours a minuit UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Rebuild manuel possible
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Etape 1: Fetch FRED + Build
  build:
    runs-on: ubuntu-latest
    CI: true
    steps:
      # Checkout du code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Fetch FRED data (actualise les donnees economiques)
      - name: Fetch FRED Data
        run: node scripts/fetch-fred.cjs
        env:
          FRED_API_KEY: 9257f2ba3e95b7f249f0c11cce2bb109

      # Build le projet
      - name: Build
        run: npm run build

      # Upload artifact pour GitHub Pages
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Etape 2: Deploy sur GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
